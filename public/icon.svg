<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#064e3b" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="256" rx="112" fill="url(#glowGrad)" />

  <!-- Center Plate & Nutrition Spark Symbol (Safe zone padded) -->
  <g filter="url(#dropShadow)" transform="translate(256, 256)">
    <!-- Outer Plate Rim -->
    <circle r="150" fill="#ffffff" fill-opacity="0.95" />
    <circle r="140" fill="none" stroke="#e2e8f0" stroke-width="4" />
    <circle r="115" fill="#f8fafc" />

    <!-- Healthy Leaf Motif (Left) -->
    <path d="M -30,20 C -70,-30 -20,-85 25,-75 C 25,-30 -5,20 -30,20 Z" fill="#10b981" />
    <path d="M -25,15 Q -5,-35 20,-70" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" />

    <!-- Fork & Knife Stylized (Right) -->
    <g transform="translate(15, -15)">
      <!-- Fork -->
      <path d="M 15,-50 L 15,-10 M 8,-50 L 8,-25 Q 8,-10 15,-10 M 22,-50 L 22,-25 Q 22,-10 15,-10 M 15,-10 L 15,45" 
            fill="none" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- AI Sparkle / Nutrition Star (Top Right) -->
    <g transform="translate(65, -65) scale(0.75)">
      <path d="M 0,-30 Q 0,0 30,0 Q 0,0 0,30 Q 0,0 -30,0 Q 0,0 0,-30 Z" fill="#f59e0b" />
      <circle r="4" fill="#ffffff" />
    </g>

    <!-- Wellness Smile Arc -->
    <path d="M -45,45 Q 0,75 45,45" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" />
  </g>
</svg>
