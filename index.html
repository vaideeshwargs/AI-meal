<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AI Smart Meal Planner</title>
    <script>
      // Suppress Vite HMR / WebSocket connection error logs in AI Studio preview iframe
      (function() {
        if (typeof window === 'undefined') return;

        // 1. Completely suppress any console.error or console.warn containing [vite]
        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            if (typeof arg === 'string' && arg.indexOf('[vite]') !== -1) return;
            if (arg && typeof arg === 'object' && arg.message && String(arg.message).indexOf('[vite]') !== -1) return;
          }
          return origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            if (typeof arg === 'string' && arg.indexOf('[vite]') !== -1) return;
          }
          return origWarn.apply(console, arguments);
        };

        // 2. Intercept WebSocket connection attempts for Vite HMR (disabled by AI Studio policy)
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          function MockViteWebSocket(url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('24678') !== -1))) {
              this.url = url;
              this.readyState = 1; // OPEN
              this.protocol = 'vite-hmr';
              this.listeners = {};
              var self = this;
              setTimeout(function() {
                if (self.onopen) self.onopen({ type: 'open' });
                var openHandlers = self.listeners['open'] || [];
                for (var j = 0; j < openHandlers.length; j++) {
                  try { openHandlers[j]({ type: 'open' }); } catch(_) {}
                }
              }, 0);
            } else {
              return new NativeWebSocket(url, protocols);
            }
          }

          MockViteWebSocket.prototype.addEventListener = function(type, listener) {
            this.listeners = this.listeners || {};
            this.listeners[type] = this.listeners[type] || [];
            this.listeners[type].push(listener);
          };

          MockViteWebSocket.prototype.removeEventListener = function(type, listener) {
            if (!this.listeners || !this.listeners[type]) return;
            this.listeners[type] = this.listeners[type].filter(function(l) { return l !== listener; });
          };

          MockViteWebSocket.prototype.send = function() {};
          MockViteWebSocket.prototype.close = function() {
            this.readyState = 3; // CLOSED
          };

          MockViteWebSocket.CONNECTING = 0;
          MockViteWebSocket.OPEN = 1;
          MockViteWebSocket.CLOSING = 2;
          MockViteWebSocket.CLOSED = 3;

          window.WebSocket = MockViteWebSocket;
        }

        // 3. Catch any uncaught window errors related to vite
        window.addEventListener('error', function(event) {
          if (event && (
            (event.message && event.message.indexOf('[vite]') !== -1) ||
            (event.filename && event.filename.indexOf('@vite') !== -1)
          )) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = reason ? (reason.message || String(reason)) : '';
          if (msg.indexOf('vite') !== -1 || msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
    <meta name="description" content="A modern, AI-powered smart meal planner for personalized nutrition, weekly meal scheduling, smart grocery lists, and interactive AI nutrition assistance." />
